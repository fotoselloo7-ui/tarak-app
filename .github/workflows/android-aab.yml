name: Tarak Android Signed AAB

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Android versionCode (must exceed previous Google Play releases)"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: tarak-android-aab
  cancel-in-progress: false

jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Tarak.app
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Verify Firebase Android client config
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "app.tarak.mobile"' android/app/google-services.json
          echo "Tarak Android Firebase config found"

      - name: Require Android upload-signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name. Add it in Settings > Secrets and variables > Actions; never commit signing files."
              exit 1
            fi
          done

      - name: Import upload key only into temporary runner
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keystore/tarak-upload-keystore.jks
          chmod 600 android/keystore/tarak-upload-keystore.jks
          test -s android/keystore/tarak-upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystore/tarak-upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          chmod 600 android/key.properties
          keytool -list -keystore android/keystore/tarak-upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Upload keystore readable; no passwords printed"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Require Maps and Google OAuth configuration
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$MAPS_KEY" || { echo "::error::GOOGLE_MAPS_ANDROID_API_KEY is missing"; exit 1; }
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "::error::GOOGLE_WEB_CLIENT_ID is missing"; exit 1; }

      - name: Build signed Tarak AAB
        env:
          ORG_GRADLE_PROJECT_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --build-name 1.1.1 --build-number "${{ inputs.build_number }}" \
            --dart-define=API_BASE_URL=https://tarak.app/api \
            --dart-define=REVERB_HOST=tarak.app \
            --dart-define=REVERB_APP_KEY=hhyfpgfv2dgv95yd78kz \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_MAPS_ENABLED=true

      - name: Verify output and non-debug signing
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/tarak-signature.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/tarak-signature.txt"; then
            echo "::error::This bundle was signed using Android Debug. Refusing release."
            exit 1
          fi
          sha256sum "$AAB"

      - name: Downloadable Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: tarak-android-1.1.1-${{ inputs.build_number }}-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
