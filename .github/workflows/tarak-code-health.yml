name: Tarak Code Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tarak-code-health.yml"
      - "mobile/lib/**"
      - "mobile/test/**"
      - "mobile/pubspec.*"
      - "tarak.app/assets/tarak-nearby-providers.js"
      - "tarak.app/assets/tarak-secure-registration.js"
      - "tarak.app/assets/tarak-auth-inline.js"
      - "tarak.app/index.html"
      - "tarak-backend/app/Http/Controllers/Api/SocialProfilePreviewController.php"
      - "tarak-backend/app/Http/Controllers/Api/RegistrationPublicConfigController.php"
      - "tarak-backend/config/services.php"
      - "dev/*.php"
      - "tarak.app/assets/CustomerDashboard-AVc8Kzdf.js"
      - "tarak-backend/app/Http/Resources/ProviderProfileResource.php"

permissions:
  contents: read

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Dart static analysis (errors are fatal)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  syntax-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser JS syntax
        run: |
          node --check tarak.app/assets/tarak-nearby-providers.js
          node --check tarak.app/assets/tarak-secure-registration.js
          node --check tarak.app/assets/tarak-auth-inline.js
          node --check tarak.app/assets/CustomerDashboard-AVc8Kzdf.js
      - name: Verify backend PHP syntax
        run: |
          php -l tarak-backend/app/Http/Resources/ProviderProfileResource.php
          php -l tarak-backend/app/Http/Controllers/Api/RegistrationVerificationController.php
          php -l tarak-backend/app/Http/Controllers/Api/SocialProfilePreviewController.php
          php -l tarak-backend/app/Http/Controllers/Api/RegistrationPublicConfigController.php
          php -l tarak-backend/config/services.php
          php -l dev/local-web-router.php
          php -l dev/local-demo-api.php
