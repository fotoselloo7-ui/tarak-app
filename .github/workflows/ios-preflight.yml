name: Tarak iOS Preflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "iOS build number (must be higher than a previously uploaded build)"
        required: true
        default: "3"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-preflight.yml"

permissions:
  contents: read

concurrency:
  group: tarak-ios-preflight
  cancel-in-progress: false

jobs:
  ios-preflight:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Tarak.app
        uses: actions/checkout@v4

      - name: Xcode and runner environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify Tarak Firebase and bundle configuration
        run: |
          test -f ios/Runner/GoogleService-Info.plist
          grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = app.tarak.mobile;" ios/Runner.xcodeproj/project.pbxproj
          grep -q "<string>app.tarak.mobile</string>" ios/Runner/GoogleService-Info.plist
          echo "Tarak iOS source configuration OK"

      - name: Configure optional OAuth and native Maps identifiers
        env:
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          TARAK_GOOGLE_IOS_CLIENT_ID: ${{ secrets.TARAK_GOOGLE_IOS_CLIENT_ID }}
          TARAK_GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ secrets.TARAK_GOOGLE_IOS_REVERSED_CLIENT_ID }}
          TARAK_MAPS_IOS_API_KEY: ${{ secrets.TARAK_MAPS_IOS_API_KEY }}
        run: |
          set -euo pipefail
          printf 'TARAK_GOOGLE_IOS_CLIENT_ID = %s\n' "$TARAK_GOOGLE_IOS_CLIENT_ID" >> ios/Flutter/Release.xcconfig
          printf 'TARAK_GOOGLE_IOS_REVERSED_CLIENT_ID = %s\n' "$TARAK_GOOGLE_IOS_REVERSED_CLIENT_ID" >> ios/Flutter/Release.xcconfig
          printf 'TARAK_MAPS_IOS_API_KEY = %s\n' "$TARAK_MAPS_IOS_API_KEY" >> ios/Flutter/Release.xcconfig
          if [ -n "$TARAK_MAPS_IOS_API_KEY" ]; then echo 'TARAK_MAPS_ENABLED=true' >> "$GITHUB_ENV"; else echo 'TARAK_MAPS_ENABLED=false' >> "$GITHUB_ENV"; fi
          echo "GOOGLE_OAUTH_WEB_CLIENT_ID=$GOOGLE_OAUTH_WEB_CLIENT_ID" >> "$GITHUB_ENV"
      - name: Build unsigned iOS app for verification
        run: |
          flutter build ios --release --no-codesign \
            --build-name 1.1.0 \
            --build-number "${{ inputs.build_number || '3' }}" \
            --dart-define=API_BASE_URL=https://tarak.app/api \
            --dart-define=REVERB_HOST=tarak.app \
            --dart-define=REVERB_APP_KEY=hhyfpgfv2dgv95yd78kz \
            --dart-define=GOOGLE_OAUTH_WEB_CLIENT_ID="$GOOGLE_OAUTH_WEB_CLIENT_ID" \
            --dart-define=TARAK_MAPS_ENABLED="$TARAK_MAPS_ENABLED"

      - name: Upload unsigned app (NOT an App Store IPA)
        uses: actions/upload-artifact@v4
        with:
          name: tarak-ios-unsigned-${{ inputs.build_number || '3' }}
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
