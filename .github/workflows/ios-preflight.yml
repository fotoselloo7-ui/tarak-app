name: Tarak iOS Preflight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "iOS build number (must be higher than a previously uploaded build)"
        required: true
        default: "6"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-preflight.yml"

permissions:
  contents: read

concurrency:
  group: tarak-ios-preflight
  cancel-in-progress: false

jobs:
  ios-preflight:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Tarak.app
        uses: actions/checkout@v4

      - name: Xcode and runner environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify Tarak Firebase and bundle configuration
        run: |
          test -f ios/Runner/GoogleService-Info.plist
          grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = app.tarak.mobile;" ios/Runner.xcodeproj/project.pbxproj
          grep -q "<string>app.tarak.mobile</string>" ios/Runner/GoogleService-Info.plist
          echo "Tarak iOS source configuration OK"

      - name: Configure Google OAuth for iOS
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID || '977885914941-lts9n172clgr8p6glbi3gv1k2qn2fkvn.apps.googleusercontent.com' }}
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "::error::GOOGLE_WEB_CLIENT_ID is missing"; exit 1; }
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            python3 tools/configure_ios_identity.py
          else
            echo "::warning::GOOGLE_IOS_CLIENT_ID is not configured; unsigned compile preflight will continue, but Google Sign-In runtime is not verified."
          fi

      - name: Build unsigned iOS app for verification
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID || '977885914941-lts9n172clgr8p6glbi3gv1k2qn2fkvn.apps.googleusercontent.com' }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name 1.1.1 \
            --build-number "${{ inputs.build_number || '6' }}" \
            --dart-define=API_BASE_URL=https://tarak.app/api \
            --dart-define=REVERB_HOST=tarak.app \
            --dart-define=REVERB_APP_KEY=hhyfpgfv2dgv95yd78kz \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Upload unsigned app (NOT an App Store IPA)
        uses: actions/upload-artifact@v4
        with:
          name: tarak-ios-unsigned-${{ inputs.build_number || '6' }}
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
